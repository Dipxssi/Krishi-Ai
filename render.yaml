# Render Blueprint — https://dashboard.render.com/blueprints
# Slim install (no torch) for Free / low-RAM.
# Real MobileNet: deploy deploy/hf-space/ to a free HF Space, then set VISION_INFERENCE_URL
# and VISION_MODEL=mobilenetv3 (sync: false below — paste Space URL in Render dashboard).
services:
  - type: web
    name: krishiai-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Must include the Vercel app origin (comma-separated). Also allow *.vercel.app via code regex.
      - key: CORS_ORIGINS
        value: https://krishi-ai-ruddy.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GROQ_MAX_TOKENS
        value: "2200"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: VISION_MODEL
        value: mobilenetv3
      - key: VISION_INFERENCE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: MARKET_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
